$kind: http-request
description: "Health check endpoint"
url: "{{baseUrl}}/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("API is healthy", function () { pm.expect(pm.response.json().success).to.be.true; });
    language: text/javascript
order: 2000
