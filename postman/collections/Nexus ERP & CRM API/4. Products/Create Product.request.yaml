$kind: http-request
description: "Create Product"
url: "{{baseUrl}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productName": "Industrial Hydraulic Valve V-200",
      "sku": "{{randSku}}",
      "category": "Hydraulics",
      "unitPrice": 12500,
      "currentStock": 40,
      "minimumStock": 8,
      "warehouseLocation": "Bay-4 Rack-C"
    }
scripts:
  - type: beforeRequest
    code: |-
      var sku = "SKU-" + Date.now().toString().slice(-6);
      pm.variables.set("randSku", sku);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 or 200", function () { pm.expect([200, 201]).to.include(pm.response.code); });
      var res = pm.response.json();
      if (res.data && res.data.id) {
          pm.collectionVariables.set("productId", res.data.id);
          if (pm.environment) pm.environment.set("productId", res.data.id);
      }
    language: text/javascript
order: 1000
