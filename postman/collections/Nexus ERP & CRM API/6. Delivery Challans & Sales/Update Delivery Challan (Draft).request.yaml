$kind: http-request
description: "Update Delivery Challan (Draft)"
url: "{{baseUrl}}/challans/{{challanId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerId": "{{customerId}}",
      "items": [
        {
          "productId": "{{productId}}",
          "quantity": 3
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
