$kind: http-request
description: "Export Challan PDF"
url: "{{baseUrl}}/challans/{{challanId}}/pdf"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Content-Type is PDF", function () { pm.expect(pm.response.headers.get("content-type")).to.include("pdf"); });
    language: text/javascript
order: 7000
