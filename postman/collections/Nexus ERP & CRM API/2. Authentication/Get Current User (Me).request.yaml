$kind: http-request
description: "Get Current User (Me)"
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.expect(pm.response.json().data.user).to.have.property("email");
    language: text/javascript
order: 5000
