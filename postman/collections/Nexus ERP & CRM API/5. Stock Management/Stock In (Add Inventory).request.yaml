$kind: http-request
description: "Stock In (Add Inventory)"
url: "{{baseUrl}}/stock/in"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}",
      "quantity": 15,
      "reason": "New shipment arrived from supplier"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 or 200", function () { pm.expect([200, 201]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
